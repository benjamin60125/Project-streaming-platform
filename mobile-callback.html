<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入完成</title></head><body><p id="status">正在完成登入…</p><script>const p=new URLSearchParams(location.hash.slice(1)),code=p.get('authorizationCode'),nonce=p.get('nonce'),expected=sessionStorage.getItem('githubLoginNonce');history.replaceState({authorizationCode:code||null},'',location.pathname);sessionStorage.removeItem('githubLoginNonce');document.getElementById('status').textContent=(code&&nonce&&expected===nonce)?'登入完成，請返回系統。':'登入資訊無效，請重新登入。';</script></body></html>
